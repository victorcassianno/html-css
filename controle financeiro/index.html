<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d8e0e7;
            color: #5f5555;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #777;
        }

        /* RESUMO */

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgb(0, 0, 0);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .card h3 {
            font-size: 14px;
            color: #a7a2a2;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 26px;
        }

        .balance {
            border-left: 5px solid #2563eb;
        }

        .income {
            border-left: 5px solid #16a34a;
        }

        .expense {
            border-left: 5px solid #dc2626;
        }

        /* FORMULÁRIO */

        .form-container {
            background: rgb(0, 0, 0);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .form-container h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
        }

        input,
        select,
        button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TRANSAÇÕES */

        .transactions {
            background: rgb(0, 0, 0);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .transactions h2 {
            margin-bottom: 20px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-info strong {
            display: block;
            margin-bottom: 5px;
        }

        .transaction-info span {
            font-size: 13px;
            color: #888;
        }

        .transaction-value {
            font-weight: bold;
        }

        .entrada {
            color: #16a34a;
        }

        .despesa {
            color: #dc2626;
        }

        .delete {
            background: #fee2e2;
            color: #dc2626;
            padding: 7px 10px;
            margin-left: 10px;
        }

        .delete:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }

        /* RESPONSIVO */

        @media (max-width: 750px) {

            body {
                padding: 15px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            form {
                grid-template-columns: 1fr;
            }

            .transaction {
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Controle Financeiro</h1>
        <p>Acompanhe suas entradas e despesas.</p>
    </header>

    <!-- RESUMO -->

    <section class="summary">

        <div class="card balance">
            <h3>Saldo atual</h3>
            <strong id="balance">R$ 0,00</strong>
        </div>

        <div class="card income">
            <h3>Total de entradas</h3>
            <strong id="income">R$ 0,00</strong>
        </div>

        <div class="card expense">
            <h3>Total de despesas</h3>
            <strong id="expense">R$ 0,00</strong>
        </div>

    </section>

    <!-- FORMULÁRIO -->

    <section class="form-container">

        <h2>Nova movimentação</h2>

        <form id="transactionForm">

            <input
                type="text"
                id="description"
                placeholder="Descrição"
                required
            >

            <input
                type="number"
                id="amount"
                placeholder="Valor"
                step="0.01"
                min="0"
                required
            >

            <select id="type">
                <option value="income">Entrada</option>
                <option value="expense">Despesa</option>
            </select>

            <button type="submit">
                Adicionar
            </button>

        </form>

    </section>

    <!-- LISTA -->

    <section class="transactions">

        <h2>Movimentações</h2>

        <div id="transactionList">
            <div class="empty">
                Nenhuma movimentação cadastrada.
            </div>
        </div>

    </section>

</div>


<script>

    let transactions = [];

    const form = document.getElementById("transactionForm");
    const description = document.getElementById("description");
    const amount = document.getElementById("amount");
    const type = document.getElementById("type");
    const transactionList = document.getElementById("transactionList");

    const balanceElement = document.getElementById("balance");
    const incomeElement = document.getElementById("income");
    const expenseElement = document.getElementById("expense");


    // ADICIONAR TRANSAÇÃO

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const transaction = {

            id: Date.now(),

            description: description.value,

            amount: Number(amount.value),

            type: type.value

        };

        transactions.push(transaction);

        form.reset();

        updateScreen();

    });


    // ATUALIZAR TELA

    function updateScreen() {

        let income = 0;
        let expense = 0;

        transactionList.innerHTML = "";

        if (transactions.length === 0) {

            transactionList.innerHTML = `
                <div class="empty">
                    Nenhuma movimentação cadastrada.
                </div>
            `;

        }

        transactions.forEach(transaction => {

            if (transaction.type === "income") {

                income += transaction.amount;

            } else {

                expense += transaction.amount;

            }

            const item = document.createElement("div");

            item.classList.add("transaction");

            item.innerHTML = `

                <div class="transaction-info">

                    <strong>
                        ${transaction.description}
                    </strong>

                    <span>
                        ${transaction.type === "income"
                            ? "Entrada"
                            : "Despesa"}
                    </span>

                </div>

                <div>

                    <span class="transaction-value 
                        ${transaction.type === "income"
                            ? "entrada"
                            : "despesa"}">

                        ${transaction.type === "income" ? "+" : "-"}
                        ${formatMoney(transaction.amount)}

                    </span>

                    <button
                        class="delete"
                        onclick="deleteTransaction(${transaction.id})">

                        Excluir

                    </button>

                </div>

            `;

            transactionList.appendChild(item);

        });


        const balance = income - expense;

        balanceElement.textContent = formatMoney(balance);

        incomeElement.textContent = formatMoney(income);

        expenseElement.textContent = formatMoney(expense);

    }


    // EXCLUIR TRANSAÇÃO

    function deleteTransaction(id) {

        transactions = transactions.filter(
            transaction => transaction.id !== id
        );

        updateScreen();

    }


    // FORMATAR VALOR

    function formatMoney(value) {

        return value.toLocaleString("pt-BR", {

            style: "currency",

            currency: "BRL"

        });

    }

</script>

</body>
</html>
```
